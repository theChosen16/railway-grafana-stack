# Grafana Datasources - Mercenary Platform
# See: https://grafana.com/docs/grafana/latest/administration/provisioning/
apiVersion: 1

prune: false

datasources:
  - name: Loki
    type: loki
    access: proxy
    orgId: 1
    uid: grafana_loki
    url: $LOKI_INTERNAL_URL
    isDefault: true
    editable: false

  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    uid: grafana_prometheus
    url: $PROMETHEUS_INTERNAL_URL
    isDefault: false
    editable: false

  - name: Tempo
    type: tempo
    access: proxy
    orgId: 1
    uid: grafana_tempo
    url: $TEMPO_INTERNAL_URL
    isDefault: false
    editable: false

  - name: PostgreSQL
    type: postgres
    access: proxy
    orgId: 1
    uid: grafana_postgres
    url: $PG_INTERNAL_HOST:$PG_INTERNAL_PORT
    user: $PG_USER
    secureJsonData:
      password: $PG_PASSWORD
    jsonData:
      database: $PG_DATABASE
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
    isDefault: false
    readOnly: true
    editable: false
