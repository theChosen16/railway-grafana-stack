# Grafana Datasources - Mercenary Platform
apiVersion: 1

prune: false

datasources:
  - name: Loki
    type: loki
    access: direct
    orgId: 1
    uid: grafana_lokiq
    url: $LOKI_INTERNAL_URL
    user:
    database:
    basicAuth:
    basicAuthUser:
    withCredentials:
    isDefault: true
  - name: Prometheus
    type: prometheus
    access: proxy
    orgId: 1
    uid: grafana_prometheus
    url: $PROMETHEUS_INTERNAL_URL
    user:
    database:
    basicAuth:
    basicAuthUser:
    withCredentials:
    isDefault: false
  - name: Tempo
    type: tempo
    access: proxy
    orgId: 1
    uid: grafana_tempo
    url: $TEMPO_INTERNAL_URL
    user:
    database:
    basicAuth:
    basicAuthUser:
    withCredentials:
    isDefault: false
  - name: PostgreSQL
    type: postgres
    access: proxy
    orgId: 1
    uid: grafana_postgres
    url: $PG_INTERNAL_HOST:$PG_INTERNAL_PORT
    user: $PG_USER
    secureJsonData:
      password: $PG_PASSWORD
    jsonData:
      database: $PG_DATABASE
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
    isDefault: false
    editable: true
