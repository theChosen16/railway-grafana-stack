# Grafana Dashboard Provisioning - Mercenary Platform
apiVersion: 1

providers:
  - name: mercenary-devops
    orgId: 1
    folder: DevOps
    folderUid: mercenary-devops
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
